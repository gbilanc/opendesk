[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "opendesk"
version = "3.4.1"
description = "Remote desktop application (TeamViewer/AnyDesk-like)"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "OpenDesk Contributors"},
]
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Communications :: File Sharing",
    "Topic :: Internet",
    "Topic :: System :: Networking",
]

# ── Core dependencies ──────────────────────────────────────────────
# Platform-specific deps use environment markers so pip auto-selects
# the correct ones for the target OS.
dependencies = [
    # Solo Essentials: include QtCore/Gui/Widgets/Network/Svg (tutto ciò che
    # l'app usa) e taglia ~170 MB di addons (Charts, 3D, Quick, Pdf, ecc.)
    "pyside6-essentials>=6.10.1",
    "Pillow>=10.2.0",
    "numpy>=2.4.4",
    "cryptography>=41.0.7",
    "PyNaCl>=1.5.0",
    "websockets>=10.4",
    "mss>=9.0.0",
    "dxcam>=0.0.5 ; sys_platform == 'win32'",
    "opencv-python>=4.9.0",
    "av>=12.0.0",
    "aiortc>=1.9.0",
    "pyzmq>=26.0",
    "argon2-cffi>=23.1.0",
    "msgpack>=1.0.0",
    # Linux (X11 + Wayland input / keyboard state)
    "python-xlib>=0.33 ; sys_platform == 'linux'",
    "dbus-next>=0.2.3   ; sys_platform == 'linux'",
    "evdev>=1.9.3       ; sys_platform == 'linux'",
    # macOS (screen capture / input via CoreGraphics)
    "pyobjc-framework-Quartz>=9.0 ; sys_platform == 'darwin'",
]

[project.urls]
Homepage = "https://github.com/gbilanc/opendesk-client"
Repository = "https://github.com/gbilanc/opendesk-client"
Issues = "https://github.com/gbilanc/opendesk-client/issues"

[project.optional-dependencies]
audio = [
    "soundcard>=0.4.6",
]
wayland = [
    "dbus-next>=0.2.3",
    "evdev>=1.9.3",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "black>=24.0",
    "ruff>=0.3.0",
    "mypy>=1.9.0",
]

[tool.setuptools.packages.find]
include = ["opendesk*"]

[tool.setuptools.package-data]
"*" = ["*.qss", "*.png", "*.svg", "*.ico"]


[tool.pytest.ini_options]
# pytest-asyncio: usa il loop di default per i fixture async
asyncio_default_fixture_loop_scope = "function"


[tool.black]
line-length = 99
target-version = ["py312"]

[tool.ruff]
line-length = 99
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.ruff.lint.per-file-ignores]
# Costanti Win32 (WM_*, SC_*) negli script di diagnostica: naming Win32 intenzionale
"tools/diagnostics/probe_*.py" = ["N806"]
"tools/diagnostics/repro_*.py" = ["N806"]
# Win32 API: nomi di struttura/handler replicano l'SDK (SERVICE_STATUS, HandlerEx...)
"opendesk/host_service.py" = ["N801", "N806"]

[[tool.mypy.overrides]]
# ctypes.WinDLL/WINFUNCTYPE/get_last_error esistono solo su Windows: i
# typeshed di Linux/macOS non li dichiarano, quindi attr-defined fallisce.
module = ["opendesk.host_service", "opendesk.core.input_injection"]
disable_error_code = ["attr-defined"]

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true

[project.scripts]
opendesk = "opendesk.app:main"
opendesk-release = "opendesk.app:main_release"
opendesk-host = "opendesk.host_app:main_host"

